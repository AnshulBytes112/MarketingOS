version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: ai_brand_growth_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_brand_growth
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai_brand_growth_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ai_brand_growth_s3
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-setup:
    image: minio/mc:latest
    container_name: ai_brand_growth_s3_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/ai-brand-growth-assets || true;
      mc anonymous set public myminio/ai-brand-growth-assets;
      echo '{\"Statement\": [{\"Action\": [\"s3:GetBucketLocation\", \"s3:ListBucket\"], \"Effect\": \"Allow\", \"Principal\": {\"AWS\": [\"*\"]}, \"Resource\": [\"arn:aws:s3:::ai-brand-growth-assets\"]}, {\"Action\": [\"s3:PutObject\", \"s3:GetObject\", \"s3:DeleteObject\"], \"Effect\": \"Allow\", \"Principal\": {\"AWS\": [\"*\"]}, \"Resource\": [\"arn:aws:s3:::ai-brand-growth-assets/*\"]}], \"Version\": \"2012-10-17\"}' > /tmp/policy.json;
      mc anonymous set-json /tmp/policy.json myminio/ai-brand-growth-assets;
      echo 'CORS and Bucket configured successfully';
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
