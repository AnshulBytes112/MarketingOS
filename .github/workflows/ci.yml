name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ai_brand_growth
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5435/ai_brand_growth?schema=public
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: "generate-a-secret-in-production"

    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install Dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate
      working-directory: packages/database

    - name: Push Database Schema
      run: npx prisma db push
      working-directory: packages/database
      
    - name: Lint
      run: npx nx run-many -t lint
      
    - name: Typecheck
      run: npx nx run-many -t typecheck
      
    - name: Unit Tests
      run: npx nx run-many -t test
      
    - name: Build
      run: npx nx build web
